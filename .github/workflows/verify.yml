# #325 — typecheck + test gate. Per global CLAUDE.md "Type errors are
# bugs" rule, every PR must pass `npm run check` (svelte-check / tsc)
# AND the vitest suite. Both run via `npm run verify`.
#
# Action SHAs pinned per CLAUDE.md "Scaffolding new projects" rule —
# tags can be force-moved by attackers, SHAs cannot. Bump tags +
# resolve fresh SHAs before any major version increment.
name: verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run verify

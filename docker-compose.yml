services:
  ot-revisited:
    image: ot-revisited:latest
    build: .
    container_name: ot-revisited
    restart: unless-stopped
    # Bind to loopback only. The reverse proxy (bare-metal traefik on wanda,
    # or any other front) routes the public hostname to this port. Never
    # expose 3020 publicly — the container is reachable only via the proxy.
    # If you're self-hosting WITHOUT a reverse proxy, drop the 127.0.0.1
    # prefix so the port is reachable on the LAN.
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - ot-data:/data

volumes:
  ot-data:

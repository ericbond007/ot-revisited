<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Trail Atlas — All 15 Landmarks</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  body { background: #2a1a10; margin: 0; padding: 24px; }
  .atlas-shell {
    max-width: 1320px;
    margin: 0 auto;
    color: var(--c-tan);
  }
  .atlas-header {
    border-bottom: 2px solid var(--c-border);
    padding-bottom: 14px;
    margin-bottom: 24px;
  }
  .atlas-title {
    font-family: var(--f-display);
    font-size: 36px;
    color: var(--c-tan-bright);
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  .atlas-sub {
    font-family: var(--f-mono);
    font-size: 12px;
    color: var(--c-wood);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .atlas-blurb {
    font-family: var(--f-body);
    font-size: 14px;
    color: var(--c-tan);
    line-height: 1.55;
    max-width: 880px;
    margin: 14px 0 0;
  }
  .atlas-blurb b { color: var(--c-tan-bright); }

  .leg-label {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--c-rust);
    text-transform: uppercase;
    margin: 28px 0 10px;
    border-top: 1px dashed var(--c-border);
    padding-top: 14px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .leg-label .leg-num {
    background: var(--c-rust-dark);
    color: var(--c-tan-bright);
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 0.1em;
  }
  .leg-label .leg-name {
    font-family: var(--f-display);
    font-size: 18px;
    color: var(--c-tan-bright);
    letter-spacing: 0.01em;
  }
  .leg-label .leg-mile {
    margin-left: auto;
    color: var(--c-wood);
    font-size: 11px;
  }

  .atlas-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
  }

  .atlas-card {
    background: var(--c-panel);
    border: 2px solid var(--c-border);
    border-radius: 3px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .atlas-card .lmk-art-shell {
    width: 100%;
    aspect-ratio: 16 / 7;
    background: var(--c-bg-raised);
    border: 1px solid var(--c-border);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .atlas-card .lmk-art-shell::after {
    content: "";
    position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4),
                inset 0 0 14px rgba(0,0,0,0.3);
    pointer-events: none;
  }
  .atlas-card .name {
    font-family: var(--f-display);
    font-size: 16px;
    color: var(--c-tan-bright);
    margin-top: 4px;
  }
  .atlas-card .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--c-wood);
    text-transform: uppercase;
  }
  .atlas-card .meta b { color: var(--c-rust); font-weight: 700; }
  .atlas-card .silh {
    font-family: var(--f-body);
    font-size: 12px;
    color: var(--c-tan);
    line-height: 1.4;
    margin-top: 2px;
  }
  .atlas-card .silh i { color: var(--c-tan-bright); font-style: normal; font-weight: 700; }

  .atlas-footer {
    margin-top: 36px;
    padding: 16px 18px;
    background: rgba(0,0,0,0.18);
    border-left: 3px solid var(--c-rust-dark);
    font-family: var(--f-body);
    font-size: 13px;
    color: var(--c-tan);
    line-height: 1.55;
  }
  .atlas-footer b { color: var(--c-tan-bright); }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Frame + all 15 landmark art components -->
  <script type="text/babel" src="src/landmark-art-frame.jsx"></script>
  <script type="text/babel" src="src/independence-art.jsx"></script>
  <script type="text/babel" src="src/kansas-river-art.jsx"></script>
  <script type="text/babel" src="src/big-blue-art.jsx"></script>
  <script type="text/babel" src="src/fort-kearny-art.jsx"></script>
  <script type="text/babel" src="src/chimney-rock-art.jsx"></script>
  <script type="text/babel" src="src/courthouse-jail-art.jsx"></script>
  <script type="text/babel" src="src/scotts-bluff-art.jsx"></script>
  <script type="text/babel" src="src/fort-laramie-art.jsx"></script>
  <script type="text/babel" src="src/independence-rock-art.jsx"></script>
  <script type="text/babel" src="src/devils-gate-art.jsx"></script>
  <script type="text/babel" src="src/south-pass-art.jsx"></script>
  <script type="text/babel" src="src/fort-bridger-art.jsx"></script>
  <script type="text/babel" src="src/soda-springs-art.jsx"></script>
  <script type="text/babel" src="src/fort-hall-art.jsx"></script>
  <script type="text/babel" src="src/three-island-art.jsx"></script>
  <script type="text/babel" src="src/whitman-mission-art.jsx"></script>
  <script type="text/babel" src="src/the-dalles-art.jsx"></script>
  <script type="text/babel" src="src/barlow-road-art.jsx"></script>

  <script type="text/babel">
    function Card({ id, name, mile, day, silhouette, Art, tone = "warm" }) {
      return (
        <div className="atlas-card">
          <div className="lmk-art-shell">
            <LandmarkArtFrame tone={tone} filterId={`atlas-${id}`}>
              <Art />
            </LandmarkArtFrame>
          </div>
          <div className="name">{name}</div>
          <div className="meta">
            <span><b>Mi {mile}</b> · ~Day {day}</span>
            <span>{tone}</span>
          </div>
          <div className="silh" dangerouslySetInnerHTML={{ __html: silhouette }} />
        </div>
      );
    }

    const LEGS = [
      {
        leg: "I",
        name: "Trail head & rivers",
        miles: "0 – 150",
        landmarks: [
          { id: "indep",   name: "Independence, MO", mile: 0,    day: 1,   tone: "warm",
            silhouette: "Reads as a <i>busy outfitting town</i> — courthouse cupola, livery sign, loaded wagons.",
            Art: () => <IndependenceArt /> },
          { id: "kansas",  name: "Kansas River",     mile: 100,  day: 8,   tone: "warm",
            silhouette: "Reads as a <i>ferry crossing</i> — flatboat with rope, oxen unyoked, broad muddy river.",
            Art: () => <KansasRiverArt /> },
          { id: "bigblue", name: "Big Blue River",   mile: 150,  day: 12,  tone: "warm",
            silhouette: "Reads as a <i>caulked-wagon ford</i> — wagons floating box-deep with tarred seams.",
            Art: () => <BigBlueArt /> },
        ],
      },
      {
        leg: "II",
        name: "Platte spires",
        miles: "300 – 600",
        landmarks: [
          { id: "kearny",   name: "Fort Kearny",          mile: 300, day: 25, tone: "warm",
            silhouette: "Reads as a <i>sod-roofed army post</i> — low buildings, parade flagpole, no walls.",
            Art: () => <FortKearnyArt /> },
          { id: "courthouse", name: "Courthouse & Jail Rocks", mile: 540, day: 42, tone: "warm",
            silhouette: "Reads as <i>two solitary buttes</i> — flat-top sandstone above an empty plain.",
            Art: () => <CourthouseJailArt /> },
          { id: "chimney",  name: "Chimney Rock",         mile: 560, day: 44, tone: "warm",
            silhouette: "Reads as a <i>single skinny spire</i> — a vertical exclamation mark on the horizon.",
            Art: () => <ChimneyRockArt /> },
          { id: "scotts",   name: "Scotts Bluff",         mile: 600, day: 47, tone: "warm",
            silhouette: "Reads as a <i>massive layered cliff</i> — Mitchell Pass cleft cutting through.",
            Art: () => <ScottsBluffArt /> },
        ],
      },
      {
        leg: "III",
        name: "Divide crossing",
        miles: "640 – 915",
        landmarks: [
          { id: "laramie", name: "Fort Laramie",        mile: 640, day: 50, tone: "warm",
            silhouette: "Reads as a <i>whitewashed adobe quadrangle</i> — Old Bedlam two-story, US flag.",
            Art: () => <FortLaramieArt /> },
          { id: "indrock", name: "Independence Rock",  mile: 815, day: 60, tone: "warm",
            silhouette: "Reads as a <i>long whale-back dome</i> — climbed by tiny figures, river curving past.",
            Art: () => <IndependenceRockArt /> },
          { id: "devils",  name: "Devil's Gate",        mile: 820, day: 60, tone: "warm",
            silhouette: "Reads as a <i>vertical cleft</i> — sheer walls bracketing a foaming Sweetwater.",
            Art: () => <DevilsGateArt /> },
          { id: "spass",   name: "South Pass",          mile: 915, day: 75, tone: "warm",
            silhouette: "Reads as <i>vast empty saddle</i> — distant snow peaks north, brown hills south.",
            Art: () => <SouthPassArt /> },
        ],
      },
      {
        leg: "IV",
        name: "Snake River country",
        miles: "1070 – 1430",
        landmarks: [
          { id: "bridger", name: "Fort Bridger",            mile: 1070, day: 85,  tone: "warm",
            silhouette: "Reads as a <i>log stockade</i> — irregular palisade in a willow valley, bartered.",
            Art: () => <FortBridgerArt /> },
          { id: "soda",    name: "Soda Springs",            mile: 1180, day: 95,  tone: "warm",
            silhouette: "Reads as <i>mineral cones with rising steam</i> — small intimate scale, fizz.",
            Art: () => <SodaSpringsArt /> },
          { id: "hall",    name: "Fort Hall",               mile: 1290, day: 100, tone: "warm",
            silhouette: "Reads as a <i>square adobe fort</i> with a Union Jack — British in contested country.",
            Art: () => <FortHallArt /> },
          { id: "three",   name: "Three Island Crossing",   mile: 1430, day: 110, tone: "warm",
            silhouette: "Reads as a <i>wide green river</i> with diagonal islands and dark basalt bluffs.",
            Art: () => <ThreeIslandCrossingArt /> },
        ],
      },
      {
        leg: "V",
        name: "Columbia gauntlet",
        miles: "1640 – 1900",
        landmarks: [
          { id: "whitman", name: "Whitman Mission",         mile: 1640, day: 125, tone: "warm",
            silhouette: "Reads as a <i>cluster of white buildings</i> in a green irrigated field — cultivated.",
            Art: () => <WhitmanMissionArt /> },
          { id: "dalles",  name: "The Dalles",              mile: 1850, day: 135, tone: "warm",
            silhouette: "Reads as a <i>basalt gorge with rafts</i> — fishing scaffolds, foamy Columbia.",
            Art: () => <TheDallesArt /> },
          { id: "barlow",  name: "Barlow Road · Laurel Hill", mile: 1900, day: 138, tone: "warm",
            silhouette: "Reads as <i>snowy Mt. Hood over fir forest</i> — chute with wagon being roped down.",
            Art: () => <BarlowRoadArt /> },
        ],
      },
    ];

    function App() {
      return (
        <div className="atlas-shell">
          <div className="atlas-header">
            <h1 className="atlas-title">Trail Atlas — All Landmarks</h1>
            <div className="atlas-sub">Independence to Oregon · 15 places · 5 legs · ~2,000 miles</div>
            <p className="atlas-blurb">
              The complete set of landmark artworks at trail-map thumbnail size, in journey order.
              Each one is a <b>shipped React component</b> in <code>landmark_art/</code> — all share the
              same <code>LandmarkArtFrame</code> chrome (paper grain, vignette, watercolor bleed) and the
              same <b>480 × 200 viewBox</b>, so they're interchangeable in any layout. Read across the
              rows: each landmark should be <b>silhouette-distinct</b> from its neighbors, even at this
              size, with no captions.
            </p>
          </div>

          {LEGS.map((leg, li) => (
            <div key={li}>
              <div className="leg-label">
                <span className="leg-num">LEG {leg.leg}</span>
                <span className="leg-name">{leg.name}</span>
                <span className="leg-mile">Mile {leg.miles}</span>
              </div>
              <div className="atlas-row" style={{
                gridTemplateColumns: leg.landmarks.length === 4
                  ? "1fr 1fr 1fr 1fr"
                  : "1fr 1fr 1fr",
              }}>
                {leg.landmarks.map((lm) => (
                  <Card key={lm.id} {...lm} />
                ))}
              </div>
            </div>
          ))}

          <div className="atlas-footer">
            <b>How to read this.</b> Each card is one landmark — silhouette, artwork, mile, approximate
            day on the trail. The <b>five legs</b> map onto the five existing per-leg canvases:
            <i> Trail Head & Rivers</i>, <i>Platte Spires</i>, <i>Divide Crossing</i>,
            <i> Snake River Country</i>, and <i>Columbia Gauntlet</i> — each of those drills into the
            same landmarks at full panel size with research notes, fresh/visited states, and detailed
            distinguishing features. This atlas is the <b>at-a-glance check</b>: are the silhouettes
            distinct, does the rhythm of the journey read across legs, do the tones sit together?
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

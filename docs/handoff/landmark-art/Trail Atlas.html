<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Trail Atlas — All 38 Landmarks</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { background: #2a1a10; margin: 0; padding: 24px; }
  .atlas-shell {
    max-width: 1400px;
    margin: 0 auto;
    color: var(--c-tan);
  }
  .atlas-header {
    border-bottom: 2px solid var(--c-border);
    padding-bottom: 14px;
    margin-bottom: 24px;
  }
  .atlas-title {
    font-family: var(--f-display);
    font-size: 36px;
    color: var(--c-tan-bright);
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  .atlas-sub {
    font-family: var(--f-mono);
    font-size: 12px;
    color: var(--c-wood);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .atlas-blurb {
    font-family: var(--f-body);
    font-size: 14px;
    color: var(--c-tan);
    line-height: 1.55;
    max-width: 920px;
    margin: 14px 0 0;
  }
  .atlas-blurb b { color: var(--c-tan-bright); }
  .atlas-blurb code {
    font-family: var(--f-mono);
    font-size: 12px;
    color: var(--c-rust);
    background: rgba(0,0,0,0.25);
    padding: 1px 5px;
    border-radius: 2px;
  }

  .leg-label {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--c-rust);
    text-transform: uppercase;
    margin: 28px 0 10px;
    border-top: 1px dashed var(--c-border);
    padding-top: 14px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .leg-label .leg-num {
    background: var(--c-rust-dark);
    color: var(--c-tan-bright);
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 0.1em;
  }
  .leg-label .leg-name {
    font-family: var(--f-display);
    font-size: 18px;
    color: var(--c-tan-bright);
    letter-spacing: 0.01em;
  }
  .leg-label .leg-mile {
    margin-left: auto;
    color: var(--c-wood);
    font-size: 11px;
  }

  .atlas-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .atlas-card {
    background: var(--c-panel);
    border: 2px solid var(--c-border);
    border-radius: 3px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
  }
  .atlas-card.kind-river   { border-color: #3a5560; }
  .atlas-card.kind-fort    { border-color: #6a3d1e; }
  .atlas-card.kind-passby  { border-color: #4a3a28; }
  .atlas-card.kind-arrival { border-color: var(--c-border); }
  .atlas-card.kind-end     { border-color: #4a6a3a; }

  .atlas-card .kind-tag {
    position: absolute;
    top: -8px; right: 8px;
    font-family: var(--f-mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    background: var(--c-bg);
    color: var(--c-wood);
    padding: 1px 6px;
    border-radius: 2px;
    border: 1px solid var(--c-border);
  }
  .atlas-card.kind-river   .kind-tag { color: #6a96a8; border-color: #3a5560; }
  .atlas-card.kind-fort    .kind-tag { color: #c88a55; border-color: #6a3d1e; }
  .atlas-card.kind-passby  .kind-tag { color: var(--c-wood); }
  .atlas-card.kind-end     .kind-tag { color: #8aa872; border-color: #4a6a3a; }

  .atlas-card .lmk-art-shell {
    width: 100%;
    aspect-ratio: 16 / 7;
    background: var(--c-bg-raised);
    border: 1px solid var(--c-border);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .atlas-card .lmk-art-shell::after {
    content: "";
    position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4),
                inset 0 0 14px rgba(0,0,0,0.3);
    pointer-events: none;
  }
  .atlas-card .name {
    font-family: var(--f-display);
    font-size: 15px;
    color: var(--c-tan-bright);
    margin-top: 4px;
    line-height: 1.15;
  }
  .atlas-card .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--c-wood);
    text-transform: uppercase;
  }
  .atlas-card .meta b { color: var(--c-rust); font-weight: 700; }
  .atlas-card .silh {
    font-family: var(--f-body);
    font-size: 11px;
    color: var(--c-tan);
    line-height: 1.4;
    margin-top: 2px;
  }
  .atlas-card .silh i { color: var(--c-tan-bright); font-style: normal; font-weight: 700; }

  .atlas-footer {
    margin-top: 36px;
    padding: 16px 18px;
    background: rgba(0,0,0,0.18);
    border-left: 3px solid var(--c-rust-dark);
    font-family: var(--f-body);
    font-size: 13px;
    color: var(--c-tan);
    line-height: 1.55;
  }
  .atlas-footer b { color: var(--c-tan-bright); }
  .atlas-footer i { color: var(--c-tan-bright); font-style: normal; }
  .atlas-footer code {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--c-rust);
    background: rgba(0,0,0,0.25);
    padding: 1px 5px;
    border-radius: 2px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 14px;
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--c-wood);
  }
  .legend-chip::before {
    content: "";
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid;
    border-radius: 2px;
  }
  .legend-chip.river::before   { border-color: #3a5560; }
  .legend-chip.fort::before    { border-color: #6a3d1e; }
  .legend-chip.passby::before  { border-color: #4a3a28; }
  .legend-chip.arrival::before { border-color: var(--c-border); }
  .legend-chip.end::before     { border-color: #4a6a3a; }
</style>
</head>
<body>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    // ──────────────────────────────────────────────────────────────────────
    // Card — one landmark thumbnail.
    // `kind` drives the colored border + corner tag so silhouette type
    // (river/fort/arrival/pass-by/end) reads at a glance across the whole
    // 38-card grid. `tone` maps to the LandmarkArtFrame palette.
    // ──────────────────────────────────────────────────────────────────────
    function Card({ id, name, mile, day, silhouette, Art, tone = "warm", kind = "arrival", tag }) {
      return (
        <div className={`atlas-card kind-${kind}`}>
          <span className="kind-tag">{tag}</span>
          <div className="lmk-art-shell">
            <LandmarkArtFrame tone={tone} filterId={`atlas-${id}`}>
              <Art />
            </LandmarkArtFrame>
          </div>
          <div className="name">{name}</div>
          <div className="meta">
            <span><b>Mi {mile}</b> · ~Day {day}</span>
            <span>{tone}</span>
          </div>
          <div className="silh" dangerouslySetInnerHTML={{ __html: silhouette }} />
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────────────
    // Canonical landmark list — 38 entries, in journey order.
    // Mirrors landmarks.ts: 1 start + 8 trading posts + 8 fords + 11 arrival
    // landmarks + 8 pass-bys + 1 endpoint = 38.
    //
    // tag values: STOP (interactive arrival), FORT (trading post), FORD
    // (river crossing), PASS-BY (visual only, no event), START / END.
    //
    // Mile + day are approximate, sourced from the in-app waypoint tables.
    // ──────────────────────────────────────────────────────────────────────

      {
        leg: "I", name: "Trail head & rivers", miles: "0 – 165",
        landmarks: [
          { id: "indep",     name: "Independence, MO",    mile: 0,    day: 1,   tone: "warm", kind: "end",     tag: "START",

            Art: () => <IndependenceArt /> },
          { id: "kansas",    name: "Kansas River Crossing", mile: 100, day: 8,  tone: "warm", kind: "river",   tag: "FORD",

          { id: "alcove",    name: "Alcove Spring",       mile: 145,  day: 11,  tone: "warm", kind: "arrival", tag: "STOP",

            Art: () => <AshHollowArt /> },

          { id: "three",     name: "Three Island Crossing", mile: 1430, day: 110, tone: "warm", kind: "river", tag: "FORD",
            silhouette: "Reads as a <i>wide green river</i> with diagonal islands and dark basalt bluffs.",
            Art: () => <ThreeIslandCrossingArt /> },
          { id: "boise",     name: "Fort Boise",          mile: 1490, day: 115, tone: "warm", kind: "fort",    tag: "FORT",

      {

        landmarks: [

            Art: () => <TheDallesArt /> },
          { id: "barlow",    name: "Barlow Road · Laurel Hill", mile: 1900, day: 138, tone: "cool", kind: "arrival", tag: "STOP",
            silhouette: "Reads as <i>snowy Mt. Hood over fir forest</i> — chute with wagon being roped down.",
            Art: () => <BarlowRoadArt /> },
          { id: "oregon",    name: "Oregon City",         mile: 2000, day: 145, tone: "warm", kind: "end",     tag: "END",
            silhouette: "Reads as a <i>frontier town by Willamette Falls</i> — mills, cabins, journey's end.",
            Art: () => <OregonCityArt /> },
        ],
      },
    ];

    function App() {
      const total = LEGS.reduce((n, l) => n + l.landmarks.length, 0);
      return (
        <div className="atlas-shell">
          <div className="atlas-header">
            <h1 className="atlas-title">Trail Atlas — All Landmarks</h1>
            <div className="atlas-sub">Independence to Oregon City · {total} places · 5 legs · ~2,000 miles</div>
            <p className="atlas-blurb">
              The complete set of landmark artworks at trail-map thumbnail size, in journey order. Each
              card is a <b>shipped React component</b> in <code>landmark_art/</code> — all share the same
              <code>LandmarkArtFrame</code> chrome (paper grain, vignette, watercolor bleed) and the same
              <b>480 × 200 viewBox</b>, so they're interchangeable in any layout. The corner tag and
              border color encode <b>landmark kind</b>: trading-post forts, river fords, arrival-event
              stops, visual-only pass-bys, and the two bookends.
            </p>
            <div className="legend">
              <span className="legend-chip end">Start / End</span>
              <span className="legend-chip fort">Fort · trading post</span>
              <span className="legend-chip river">River · ford</span>
              <span className="legend-chip arrival">Arrival · stop event</span>
              <span className="legend-chip passby">Pass-by · visual only</span>
            </div>
          </div>

          {LEGS.map((leg, li) => (
            <div key={li}>
              <div className="leg-label">
                <span className="leg-num">LEG {leg.leg}</span>
                <span className="leg-name">{leg.name}</span>
                <span className="leg-mile">{leg.landmarks.length} landmarks · Mile {leg.miles}</span>
              </div>
              <div className="atlas-row">
                {leg.landmarks.map((lm) => (
                  <Card key={lm.id} {...lm} />
                ))}
              </div>
            </div>
          ))}

          <div className="atlas-footer">
            <b>How to read this.</b> Each card is one landmark — silhouette description, artwork, mile,
            approximate day on the trail. Border color and corner tag encode landmark <i>kind</i>: forts
            (warm rust), rivers (cool teal), arrivals (neutral), pass-bys (muted), bookends (green).
            The <b>five legs</b> match the per-leg detail canvases — <i>Trail Head & Rivers</i>,
            <i> Platte Spires</i>, <i>Divide Crossing</i>, <i>Snake River Country</i>, <i>Columbia
            Gauntlet</i> — which drill into the same landmarks at full panel size with research notes,
            fresh / visited / abandoned states, and detailed distinguishing features. This atlas is the
            <b> at-a-glance check</b>: are the silhouettes distinct, does the journey rhythm read across
            legs, do the tones sit together?
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

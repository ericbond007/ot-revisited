<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Landmark Artwork — Independence / Kansas River / Big Blue</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { background: #2a1a10; }
  .lmk-art-shell {
    width: 100%;
    aspect-ratio: 16 / 7;
    background: var(--c-bg-raised);
    border: 2px solid var(--c-border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .lmk-art-shell::after {
    content: "";
    position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4),
                inset 0 0 16px rgba(0,0,0,0.3);
    pointer-events: none;
  }
  .lmk-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 12px 4px 6px;
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--c-wood);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .lmk-meta strong { color: var(--c-tan-bright); letter-spacing: 0.08em; }
  .lmk-notes {
    margin: 8px 4px 0;
    padding: 10px 12px;
    background: rgba(0,0,0,0.18);
    border-left: 3px solid var(--c-rust-dark);
    font-family: var(--f-body);
    font-size: 13px;
    color: var(--c-tan);
    line-height: 1.5;
  }
  .lmk-notes b { color: var(--c-tan-bright); font-weight: 700; }
  .lmk-comparison {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .lmk-comparison .panel-shell {
    background: var(--c-panel);
    border: 2px solid var(--c-border);
    border-radius: 3px;
    padding: 12px;
  }
  .lmk-comparison h4 {
    color: var(--c-rust);
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    margin: 0 0 8px;
  }
  .lmk-comparison .lmk-art-shell { aspect-ratio: 16 / 6; }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Design canvas -->
  <script type="text/babel" src="design-canvas.jsx"></script>

  <!-- Shared frame + landmark art -->
  <script type="text/babel" src="landmark-art-frame.jsx"></script>
  <script type="text/babel" src="independence-art.jsx"></script>
  <script type="text/babel" src="kansas-river-art.jsx"></script>
  <script type="text/babel" src="big-blue-art.jsx"></script>

  <script type="text/babel">
    function FramedArt({ Art, tone = "warm", filterId, abandoned = false }) {
      return (
        <LandmarkArtFrame tone={tone} filterId={filterId} abandoned={abandoned}>
          <Art />
        </LandmarkArtFrame>
      );
    }

    // Each landmark gets one section. Inside each section we present:
    //   1) the art at full panel size (the way it'd appear in-game)
    //   2) a "fresh vs visited" state comparison
    //   3) research notes — distinguishing visual marks
    //
    // Fixed at 720×440 to match the LandmarkPanel art slot used elsewhere.

    function LandmarkSection({ id, title, ArtComponent, tone, notes, features, caption, day }) {
      return (
        <DCSection id={id} title={title}>
          {/* Full panel — what the player sees on landmark arrival */}
          <DCArtboard id={`${id}-full`} label="Full panel — Arrival view" width={720} height={440}>
            <div style={{
              padding: 24, height: "100%", boxSizing: "border-box",
              display: "flex", flexDirection: "column", gap: 12,
            }}>
              <div className="lmk-meta">
                <span>{day} · Landmark</span>
                <strong>{caption}</strong>
              </div>
              <div className="lmk-art-shell">
                <FramedArt Art={ArtComponent} tone={tone} filterId={`${id}-full`} />
              </div>
              <div className="lmk-notes">
                {notes}
              </div>
            </div>
          </DCArtboard>

          {/* Comparison: clean vs visited state */}
          <DCArtboard id={`${id}-states`} label="States — Fresh vs. Visited" width={720} height={420}>
            <div style={{ padding: 20, height: "100%", boxSizing: "border-box" }}>
              <div className="lmk-comparison" style={{ height: "calc(100% - 8px)" }}>
                <div className="panel-shell">
                  <h4>Fresh arrival</h4>
                  <div className="lmk-art-shell">
                    <FramedArt Art={ArtComponent} tone={tone} filterId={`${id}-fresh`} />
                  </div>
                </div>
                <div className="panel-shell">
                  <h4>Already visited (faded)</h4>
                  <div className="lmk-art-shell">
                    <FramedArt Art={ArtComponent} tone={tone} filterId={`${id}-vis`} abandoned />
                  </div>
                </div>
              </div>
            </div>
          </DCArtboard>

          {/* Research notes — what makes it distinctive */}
          <DCArtboard id={`${id}-research`} label="Research notes — distinguishing features" width={500} height={440}>
            <div style={{
              padding: 24, height: "100%", boxSizing: "border-box",
              fontFamily: "var(--f-body)", fontSize: 14, color: "var(--c-tan)",
              overflowY: "auto",
            }}>
              <div style={{
                fontFamily: "var(--f-display)", fontSize: 22,
                color: "var(--c-rust)", marginBottom: 4,
              }}>{title}</div>
              <div style={{
                fontFamily: "var(--f-mono)", fontSize: 11, letterSpacing: "0.14em",
                color: "var(--c-wood)", textTransform: "uppercase", marginBottom: 16,
              }}>Distinguishing visual marks</div>
              <ul style={{ paddingLeft: 18, margin: 0, lineHeight: 1.55 }}>
                {features.map((f, i) => (
                  <li key={i} style={{ marginBottom: 8 }}>
                    <b style={{ color: "var(--c-tan-bright)" }}>{f.title}.</b> {f.body}
                  </li>
                ))}
              </ul>
            </div>
          </DCArtboard>
        </DCSection>
      );
    }

    function ThumbCard({ label, sub, Art, tone = "warm", tid = "t" }) {
      return (
        <div style={{
          background: "var(--c-panel)",
          border: "2px solid var(--c-border)",
          borderRadius: 3,
          padding: 10,
          display: "flex", flexDirection: "column", gap: 6,
        }}>
          <div className="lmk-art-shell" style={{ aspectRatio: "16 / 7" }}>
            <FramedArt Art={Art} tone={tone} filterId={tid} />
          </div>
          <div style={{
            fontFamily: "var(--f-display)", fontSize: 16,
            color: "var(--c-tan-bright)",
          }}>{label}</div>
          <div style={{
            fontFamily: "var(--f-mono)", fontSize: 10,
            letterSpacing: "0.1em", color: "var(--c-wood)",
            textTransform: "uppercase",
          }}>{sub}</div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas
          title="Landmark Artwork — Trail Head & Rivers"
          subtitle="Independence (mile 0), Kansas River (mile 102), Big Blue / Alcove Spring (mile 187)"
        >
          <LandmarkSection
            id="independence"
            title="Independence, Missouri"
            ArtComponent={IndependenceArt}
            tone="warm"
            day="Day 1"
            caption="Independence — Trail Head"
            notes={<><b>Queen City of the Trails.</b> A bustling 1840s frontier town: brick courthouse with cupola anchoring the square, frame mercantile storefronts, a blacksmith shed throwing smoke, and wagons being outfitted in the foreground. The energy is <i>departure</i> — wagons assembled, oxen yoked, barrels stacked, men loading.</>}
            features={[
              { title: "Brick courthouse with cupola", body: "The hero element — warm-red brick two-story with a columned porch, gable, and a small white cupola. The literal starting point of the trail." },
              { title: "False-front mercantile",      body: "Frame storefronts with tall flat parapets and clapboard siding. Awnings, sign-bands, big glass window — distinctly 1840s commercial vernacular." },
              { title: "Blacksmith shed + smoke",     body: "Open-front shed with chimney throwing dense smoke, anvil silhouette and forge-glow inside. Says 'wagons being prepped' without words." },
              { title: "Outfitted wagons foreground", body: "Two prairie schooners — one fully assembled, one being loaded. Stacked barrels, crates, yoked ox pair. The town is the ENGINE that puts wagons on the trail." },
              { title: "Leafy cottonwoods",           body: "Generous mid-spring canopies scattered through town — Independence is wooded Missouri, NOT the bare plains. Critical contrast with later landmarks." },
              { title: "Low Missouri bluffs",         body: "Soft wooded ridge on the horizon — gentle, rolling. The land hasn't opened up yet." },
            ]}
          />

          <LandmarkSection
            id="kansas"
            title="Kansas River — Pappan's Ferry"
            ArtComponent={KansasRiverArt}
            tone="warm"
            day="Day 12"
            caption="Kansas River Crossing"
            notes={<><b>The first major obstacle.</b> A wide turbid river, a rope strung bank-to-bank, and a flatboat — two cottonwood dugouts lashed parallel with planks across — ferrying a wagon to the far shore. Oxen swim alongside. Other wagons queue on the near bank; on the far bank a double-team hauls one up the muddy ramp.</>}
            features={[
              { title: "Wide flat river",          body: "The river fills the middle band of the composition. Turbid brown-tan water with current striations — never blue, never sparkling. The Kansas was big, swift, muddy." },
              { title: "Rope across the river",   body: "Stretched tree-to-tree at chest height — visible thin line tying the two banks together. The ferry's tether to the rope reads as a vertical." },
              { title: "Flatboat / dugout ferry", body: "Two parallel cottonwood-log dugouts lashed with cross-planks, wagon perched on top. Boatman with a long pole. This is the period-correct ferry idiom — not a barge." },
              { title: "Swimming oxen",           body: "Just heads, horns, and wakes visible above the water. They don't ride the boat — they swim." },
              { title: "Queued wagons + double-team", body: "Wagons waiting on the near bank; on the far bank a long ox-team strains to haul a wagon up the steep mudbank. Shows the BEFORE / AFTER of crossing." },
              { title: "Distant Kanza village",   body: "Tiny tipi-cone dots on the horizon — the journals mention it. Adds period-specific geography without distracting." },
            ]}
          />

          <LandmarkSection
            id="bigblue"
            title="Big Blue — Alcove Spring"
            ArtComponent={BigBlueArt}
            tone="warm"
            day="Day 21"
            caption="Big Blue Crossing — Alcove Spring"
            notes={<><b>One of the most romantic spots on the trail.</b> A shelving rock projects over a basin, a 10–12 ft cascade pours into a clear pool, and lush hardwood forest frames the alcove. Pioneer names are carved into the rock face. A wagon camp waits on the meadow for the swollen Big Blue (visible at right) to fall — cookfire smoke drifts up.</>}
            features={[
              { title: "The alcove + waterfall",   body: "Hero element — a shelving rock with a 10-ft cascade falling into a basin. White ribbons of falling water against tan stone, ringed by green shrubbery. Unmistakable silhouette." },
              { title: "Carved names on rock",     body: "Tiny etched marks on the rock face — the Donner-era graffiti the spring is famous for. Detail you only catch when looking, but lifts the whole image." },
              { title: "Lush hardwood forest",     body: "Heavy, leafy canopy framing the scene — oak and cottonwood. Big Blue is the LAST forested place; this look should not appear after Fort Kearny." },
              { title: "Wagon camp + cookfires",   body: "Four wagons spread across the meadow with two fires drifting smoke. The camp is WAITING — the river's too high to cross. Sets up the tension of the historical event." },
              { title: "Big Blue at right edge",   body: "Swollen brown river angles into the corner — a watery threat in the periphery, balancing the calm spring on the left." },
              { title: "Raft being built",         body: "Two hewn logs lashed near the river's edge with a worker — the makeshift Donner ferry under construction. Period-accurate detail." },
            ]}
          />

          {/* Side-by-side silhouette comparison */}
          <DCSection id="compare" title="Side-by-side — silhouette read">
            <DCArtboard id="thumb-row" label="Trail-map thumbnail size" width={720} height={260}>
              <div style={{
                padding: 24, height: "100%", boxSizing: "border-box",
                display: "flex", flexDirection: "column", gap: 16,
              }}>
                <div style={{
                  fontFamily: "var(--f-mono)", fontSize: 11, letterSpacing: "0.14em",
                  color: "var(--c-wood)", textTransform: "uppercase",
                }}>Are the three reads distinct?</div>
                <div style={{
                  display: "grid", gridTemplateColumns: "1fr 1fr 1fr",
                  gap: 14, alignItems: "stretch",
                }}>
                  <ThumbCard label="Independence" sub="Town: courthouse, wagons, smoke" Art={IndependenceArt} tone="warm" tid="thumb-i" />
                  <ThumbCard label="Kansas River" sub="River: ferry, rope, swimming oxen" Art={KansasRiverArt} tone="warm" tid="thumb-k" />
                  <ThumbCard label="Big Blue"     sub="Spring: cascade, alcove, camp" Art={BigBlueArt} tone="warm" tid="thumb-b" />
                </div>
                <div style={{
                  fontFamily: "var(--f-body)", fontSize: 13, color: "var(--c-tan)",
                  lineHeight: 1.5, marginTop: 4,
                }}>
                  Each scene reads differently at thumbnail scale: <b style={{color:"var(--c-tan-bright)"}}>Independence</b> is a TOWN silhouette (vertical buildings + cupola), <b style={{color:"var(--c-tan-bright)"}}>Kansas</b> is a HORIZONTAL band of water with the rope and ferry breaking the middle, and <b style={{color:"var(--c-tan-bright)"}}>Big Blue</b> is a CASCADE — vertical white ribbons against stone, framed by green.
                </div>
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

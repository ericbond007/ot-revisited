<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Landmark Artwork — Courthouse / Chimney / Scotts Bluff</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { background: #2a1a10; }
  .lmk-art-shell {
    width: 100%;
    aspect-ratio: 16 / 7;
    background: var(--c-bg-raised);
    border: 2px solid var(--c-border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .lmk-art-shell::after {
    content: "";
    position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4),
                inset 0 0 16px rgba(0,0,0,0.3);
    pointer-events: none;
  }
  .lmk-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 12px 4px 6px;
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--c-wood);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .lmk-meta strong { color: var(--c-tan-bright); letter-spacing: 0.08em; }
  .lmk-notes {
    margin: 8px 4px 0;
    padding: 10px 12px;
    background: rgba(0,0,0,0.18);
    border-left: 3px solid var(--c-rust-dark);
    font-family: var(--f-body);
    font-size: 13px;
    color: var(--c-tan);
    line-height: 1.5;
  }
  .lmk-notes b { color: var(--c-tan-bright); font-weight: 700; }
  .lmk-comparison {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .lmk-comparison .panel-shell {
    background: var(--c-panel);
    border: 2px solid var(--c-border);
    border-radius: 3px;
    padding: 12px;
  }
  .lmk-comparison h4 {
    color: var(--c-rust);
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    margin: 0 0 8px;
  }
  .lmk-comparison .lmk-art-shell { aspect-ratio: 16 / 6; }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Design canvas -->
  <script type="text/babel" src="design-canvas.jsx"></script>

  <!-- Shared frame + landmark art -->
  <script type="text/babel" src="landmark-art-frame.jsx"></script>
  <script type="text/babel" src="courthouse-jail-art.jsx"></script>
  <script type="text/babel" src="chimney-rock-art.jsx"></script>
  <script type="text/babel" src="scotts-bluff-art.jsx"></script>

  <script type="text/babel">
    function FramedArt({ Art, tone = "warm", filterId, abandoned = false }) {
      return (
        <LandmarkArtFrame tone={tone} filterId={filterId} abandoned={abandoned}>
          <Art />
        </LandmarkArtFrame>
      );
    }

    // Three Platte-valley landmarks, in the order pioneers actually saw them:
    //   1. Courthouse & Jail Rocks  — first real vertical features
    //   2. Chimney Rock              — most-mentioned landmark on the trail
    //   3. Scotts Bluff              — biggest, most dramatic; threads pass
    //
    // Same artboard structure as the Forts / Trail Head canvases:
    // full panel, fresh-vs-visited states, research notes, and a
    // silhouette comparison row at the end.

    function LandmarkSection({ id, title, ArtComponent, tone, notes, features, caption, day }) {
      return (
        <DCSection id={id} title={title}>
          <DCArtboard id={`${id}-full`} label="Full panel — Arrival view" width={720} height={440}>
            <div style={{
              padding: 24, height: "100%", boxSizing: "border-box",
              display: "flex", flexDirection: "column", gap: 12,
            }}>
              <div className="lmk-meta">
                <span>{day} · Landmark</span>
                <strong>{caption}</strong>
              </div>
              <div className="lmk-art-shell">
                <FramedArt Art={ArtComponent} tone={tone} filterId={`${id}-full`} />
              </div>
              <div className="lmk-notes">
                {notes}
              </div>
            </div>
          </DCArtboard>

          <DCArtboard id={`${id}-states`} label="States — Fresh vs. Visited" width={720} height={420}>
            <div style={{ padding: 20, height: "100%", boxSizing: "border-box" }}>
              <div className="lmk-comparison" style={{ height: "calc(100% - 8px)" }}>
                <div className="panel-shell">
                  <h4>Fresh arrival</h4>
                  <div className="lmk-art-shell">
                    <FramedArt Art={ArtComponent} tone={tone} filterId={`${id}-fresh`} />
                  </div>
                </div>
                <div className="panel-shell">
                  <h4>Already visited (faded)</h4>
                  <div className="lmk-art-shell">
                    <FramedArt Art={ArtComponent} tone={tone} filterId={`${id}-vis`} abandoned />
                  </div>
                </div>
              </div>
            </div>
          </DCArtboard>

          <DCArtboard id={`${id}-research`} label="Research notes — distinguishing features" width={500} height={440}>
            <div style={{
              padding: 24, height: "100%", boxSizing: "border-box",
              fontFamily: "var(--f-body)", fontSize: 14, color: "var(--c-tan)",
              overflowY: "auto",
            }}>
              <div style={{
                fontFamily: "var(--f-display)", fontSize: 22,
                color: "var(--c-rust)", marginBottom: 4,
              }}>{title}</div>
              <div style={{
                fontFamily: "var(--f-mono)", fontSize: 11, letterSpacing: "0.14em",
                color: "var(--c-wood)", textTransform: "uppercase", marginBottom: 16,
              }}>Distinguishing visual marks</div>
              <ul style={{ paddingLeft: 18, margin: 0, lineHeight: 1.55 }}>
                {features.map((f, i) => (
                  <li key={i} style={{ marginBottom: 8 }}>
                    <b style={{ color: "var(--c-tan-bright)" }}>{f.title}.</b> {f.body}
                  </li>
                ))}
              </ul>
            </div>
          </DCArtboard>
        </DCSection>
      );
    }

    function ThumbCard({ label, sub, Art, tone = "warm", tid = "t" }) {
      return (
        <div style={{
          background: "var(--c-panel)",
          border: "2px solid var(--c-border)",
          borderRadius: 3,
          padding: 10,
          display: "flex", flexDirection: "column", gap: 6,
        }}>
          <div className="lmk-art-shell" style={{ aspectRatio: "16 / 7" }}>
            <FramedArt Art={Art} tone={tone} filterId={tid} />
          </div>
          <div style={{
            fontFamily: "var(--f-display)", fontSize: 16,
            color: "var(--c-tan-bright)",
          }}>{label}</div>
          <div style={{
            fontFamily: "var(--f-mono)", fontSize: 10,
            letterSpacing: "0.1em", color: "var(--c-wood)",
            textTransform: "uppercase",
          }}>{sub}</div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas
          title="Landmark Artwork — Platte Spires"
          subtitle="Courthouse & Jail Rocks (mile 530), Chimney Rock (mile 550), Scotts Bluff (mile 590) — the dramatic geology of the western Platte"
        >
          <LandmarkSection
            id="courthouse"
            title="Courthouse & Jail Rocks"
            ArtComponent={CourthouseJailArt}
            tone="warm"
            day="Day 38"
            caption="Courthouse & Jail Rocks"
            notes={<><b>The first real vertical feature in weeks.</b> Two stratified buttes rise abruptly from the flat plain — the larger Courthouse Rock with its near-architectural silhouette ("the Capitol"), and the smaller Jail Rock just east. Pioneers nooned in the meadow at base; many had never seen a mountain before. Strong horizontal layering of clay, sandstone, and ash.</>}
            features={[
              { title: "Two distinct buttes",      body: "Courthouse Rock LEFT (larger, blockier), Jail Rock RIGHT (smaller, squarer). Reading them as a PAIR is the silhouette that separates this landmark from Chimney Rock." },
              { title: "Quadrilangular form",      body: "Both have flat tops and stepped, almost architectural sides. Pioneers called Courthouse 'the Capitol,' 'the Castle,' 'the Solitary Tower.' The hint of a small dome on Courthouse drives that read." },
              { title: "Horizontal stratification",body: "Strong banded layers of clay/sandstone/ash run the full width — the most pronounced layering of any Platte landmark. A clear visual signature." },
              { title: "Eroded skirt at base",     body: "Broad sloping mound of eroded clay surrounds each rock — the soft Brule clay washing down from under the harder sandstone cap." },
              { title: "Wagon noon camp",          body: "Loose cluster of three wagons at base, oxen unyoked and grazing, smoke from cookfire. NOT circled — this is a midday rest, not a night camp." },
              { title: "Pumpkin Creek meadow",     body: "Slightly greener band crosses the mid-ground — the creek with cottonwood clumps. The only green for miles." },
            ]}
          />

          <LandmarkSection
            id="chimney"
            title="Chimney Rock"
            ArtComponent={ChimneyRockArt}
            tone="warm"
            day="Day 41"
            caption="Chimney Rock — &ldquo;a grand and splendid object&rdquo;"
            notes={<><b>The most-mentioned landmark on the entire trail.</b> 95–97% of pioneers who kept journals wrote about it. A lone narrow spire rises from a broad conical pedestal on the otherwise flat plain — visible from 30 miles away, and so fragile-looking that travelers in the 1840s wrote it "looks as if it would not stand a week." The spire is ~120 ft of a 325 ft total.</>}
            features={[
              { title: "The spire",                body: "Narrow tapered column rising 120 ft from a broader pedestal — slightly asymmetric, with a darker sandstone cap protecting the top. THE silhouette of the trail." },
              { title: "Conical pedestal",         body: "Broad sloping mound of soft Brule clay — eroded into vertical gulleys with horizontal stratification. The pedestal is twice as tall as the spire." },
              { title: "Solitary on the plain",    body: "No nearby formations — this is what makes it so striking. Vast empty sky around it. Composition leaves room for that emptiness." },
              { title: "Distant North Platte",     body: "The river ribbon visible behind the rock — emigrants tracked the Platte continuously, and Chimney was the marker for entering the western valley." },
              { title: "Wagon train passing",      body: "Three small wagons + outrider in the mid-foreground — small enough to give SCALE to the spire. Roughly to-scale: a wagon is ~10 ft, spire ~120 ft." },
              { title: "Subtle haze halo",         body: "Soft glow around the spire — atmospheric perspective. Pioneers saw it through summer haze on the plains; it should feel a touch unreal." },
            ]}
          />

          <LandmarkSection
            id="scotts"
            title="Scotts Bluff & Mitchell Pass"
            ArtComponent={ScottsBluffArt}
            tone="warm"
            day="Day 44"
            caption="Scotts Bluff — Mitchell Pass"
            notes={<><b>The biggest, most imposing landmark of the Platte stretch.</b> An 800-ft cliff complex with a narrow V-shaped pass cut between Scotts Bluff proper (left) and Eagle Rock / South Bluff (right). Wagon trains threaded through Mitchell Pass single-file, dwarfed by the cliffs. The DRAMA here is SCALE — wagons look like toys against the rock.</>}
            features={[
              { title: "Massive cliff complex",    body: "Two huge bluff masses fill the comp — far taller than Courthouse Rock or Chimney Rock. Rugged, irregular outline (NOT blocky like Courthouse). The cliffs read as MOUNTAIN-scale." },
              { title: "Mitchell Pass V-notch",    body: "Narrow V-shaped gap between the two masses, with a darker shadow inside the deepest part. THE distinguishing silhouette element — the gap is the through-line of the entire image." },
              { title: "Wagons threading the pass",body: "Three tiny wagons single-file in the pass + four bigger ones approaching in the foreground. The size progression communicates depth + the IMMENSITY of the formation." },
              { title: "Pines on upper slopes",    body: "Small dark conifer cones scattered on the upper bluff — Scotts Bluff is high enough to support juniper and pine, unlike the lower formations. A real visual distinction." },
              { title: "Erosion gullies",          body: "Vertical ribbons of darker clay running the full height of the cliffs — gives the rock its rugged, fluted texture." },
              { title: "Birds on cliff updrafts",  body: "A few tiny V-shapes high overhead — emphasizes the height of the cliffs by giving the empty sky a vertical anchor." },
            ]}
          />

          {/* Side-by-side silhouette comparison */}
          <DCSection id="compare" title="Side-by-side — silhouette read">
            <DCArtboard id="thumb-row" label="Trail-map thumbnail size" width={720} height={260}>
              <div style={{
                padding: 24, height: "100%", boxSizing: "border-box",
                display: "flex", flexDirection: "column", gap: 16,
              }}>
                <div style={{
                  fontFamily: "var(--f-mono)", fontSize: 11, letterSpacing: "0.14em",
                  color: "var(--c-wood)", textTransform: "uppercase",
                }}>Are the three reads distinct?</div>
                <div style={{
                  display: "grid", gridTemplateColumns: "1fr 1fr 1fr",
                  gap: 14, alignItems: "stretch",
                }}>
                  <ThumbCard label="Courthouse" sub="Two flat-top buttes, paired" Art={CourthouseJailArt} tone="warm" tid="thumb-c" />
                  <ThumbCard label="Chimney"    sub="Lone spire on empty plain" Art={ChimneyRockArt}     tone="warm" tid="thumb-h" />
                  <ThumbCard label="Scotts"     sub="Massive cliffs, V-pass" Art={ScottsBluffArt}        tone="warm" tid="thumb-s" />
                </div>
                <div style={{
                  fontFamily: "var(--f-body)", fontSize: 13, color: "var(--c-tan)",
                  lineHeight: 1.5, marginTop: 4,
                }}>
                  Each formation has a distinct silhouette: <b style={{color:"var(--c-tan-bright)"}}>Courthouse</b> reads as a PAIR of stepped, flat-top buttes; <b style={{color:"var(--c-tan-bright)"}}>Chimney</b> as a SOLITARY needle on an empty plain; <b style={{color:"var(--c-tan-bright)"}}>Scotts</b> as a horizontal MASSIF with a notch in the middle. The progression also tells a SCALE story — each is bigger than the last.
                </div>
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

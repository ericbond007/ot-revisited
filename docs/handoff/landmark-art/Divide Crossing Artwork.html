<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Landmark Artwork — Independence Rock / Devil's Gate / South Pass</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { background: #2a1a10; }
  .lmk-art-shell {
    width: 100%;
    aspect-ratio: 16 / 7;
    background: var(--c-bg-raised);
    border: 2px solid var(--c-border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .lmk-art-shell::after {
    content: "";
    position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4),
                inset 0 0 16px rgba(0,0,0,0.3);
    pointer-events: none;
  }
  .lmk-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 12px 4px 6px;
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--c-wood);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .lmk-meta strong { color: var(--c-tan-bright); letter-spacing: 0.08em; }
  .lmk-notes {
    margin: 8px 4px 0;
    padding: 10px 12px;
    background: rgba(0,0,0,0.18);
    border-left: 3px solid var(--c-rust-dark);
    font-family: var(--f-body);
    font-size: 13px;
    color: var(--c-tan);
    line-height: 1.5;
  }
  .lmk-notes b { color: var(--c-tan-bright); font-weight: 700; }
  .lmk-comparison {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .lmk-comparison .panel-shell {
    background: var(--c-panel);
    border: 2px solid var(--c-border);
    border-radius: 3px;
    padding: 12px;
  }
  .lmk-comparison h4 {
    color: var(--c-rust);
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    margin: 0 0 8px;
  }
  .lmk-comparison .lmk-art-shell { aspect-ratio: 16 / 6; }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Design canvas -->
  <script type="text/babel" src="design-canvas.jsx"></script>

  <!-- Shared frame + landmark art -->
  <script type="text/babel" src="landmark-art-frame.jsx"></script>
  <script type="text/babel" src="independence-rock-art.jsx"></script>
  <script type="text/babel" src="devils-gate-art.jsx"></script>
  <script type="text/babel" src="south-pass-art.jsx"></script>

  <script type="text/babel">
    function FramedArt({ Art, tone = "warm", filterId, abandoned = false }) {
      return (
        <LandmarkArtFrame tone={tone} filterId={filterId} abandoned={abandoned}>
          <Art />
        </LandmarkArtFrame>
      );
    }

    // The divide crossing — three landmarks within ~100 miles of each other,
    // marking the trail's transition from plains to Pacific watershed:
    //   1. Independence Rock — the Register of the Desert (~mi 815)
    //   2. Devil's Gate      — Sweetwater cleft (~mi 820)
    //   3. South Pass        — Continental Divide (~mi 915)
    //
    // Same artboard pattern: full panel + states + research notes,
    // closed by a silhouette comparison.

    function LandmarkSection({ id, title, ArtComponent, tone, notes, features, caption, day }) {
      return (
        <DCSection id={id} title={title}>
          <DCArtboard id={`${id}-full`} label="Full panel — Arrival view" width={720} height={440}>
            <div style={{
              padding: 24, height: "100%", boxSizing: "border-box",
              display: "flex", flexDirection: "column", gap: 12,
            }}>
              <div className="lmk-meta">
                <span>{day} · Landmark</span>
                <strong>{caption}</strong>
              </div>
              <div className="lmk-art-shell">
                <FramedArt Art={ArtComponent} tone={tone} filterId={`${id}-full`} />
              </div>
              <div className="lmk-notes">
                {notes}
              </div>
            </div>
          </DCArtboard>

          <DCArtboard id={`${id}-states`} label="States — Fresh vs. Visited" width={720} height={420}>
            <div style={{ padding: 20, height: "100%", boxSizing: "border-box" }}>
              <div className="lmk-comparison" style={{ height: "calc(100% - 8px)" }}>
                <div className="panel-shell">
                  <h4>Fresh arrival</h4>
                  <div className="lmk-art-shell">
                    <FramedArt Art={ArtComponent} tone={tone} filterId={`${id}-fresh`} />
                  </div>
                </div>
                <div className="panel-shell">
                  <h4>Already visited (faded)</h4>
                  <div className="lmk-art-shell">
                    <FramedArt Art={ArtComponent} tone={tone} filterId={`${id}-vis`} abandoned />
                  </div>
                </div>
              </div>
            </div>
          </DCArtboard>

          <DCArtboard id={`${id}-research`} label="Research notes — distinguishing features" width={500} height={440}>
            <div style={{
              padding: 24, height: "100%", boxSizing: "border-box",
              fontFamily: "var(--f-body)", fontSize: 14, color: "var(--c-tan)",
              overflowY: "auto",
            }}>
              <div style={{
                fontFamily: "var(--f-display)", fontSize: 22,
                color: "var(--c-rust)", marginBottom: 4,
              }}>{title}</div>
              <div style={{
                fontFamily: "var(--f-mono)", fontSize: 11, letterSpacing: "0.14em",
                color: "var(--c-wood)", textTransform: "uppercase", marginBottom: 16,
              }}>Distinguishing visual marks</div>
              <ul style={{ paddingLeft: 18, margin: 0, lineHeight: 1.55 }}>
                {features.map((f, i) => (
                  <li key={i} style={{ marginBottom: 8 }}>
                    <b style={{ color: "var(--c-tan-bright)" }}>{f.title}.</b> {f.body}
                  </li>
                ))}
              </ul>
            </div>
          </DCArtboard>
        </DCSection>
      );
    }

    function ThumbCard({ label, sub, Art, tone = "warm", tid = "t" }) {
      return (
        <div style={{
          background: "var(--c-panel)",
          border: "2px solid var(--c-border)",
          borderRadius: 3,
          padding: 10,
          display: "flex", flexDirection: "column", gap: 6,
        }}>
          <div className="lmk-art-shell" style={{ aspectRatio: "16 / 7" }}>
            <FramedArt Art={Art} tone={tone} filterId={tid} />
          </div>
          <div style={{
            fontFamily: "var(--f-display)", fontSize: 16,
            color: "var(--c-tan-bright)",
          }}>{label}</div>
          <div style={{
            fontFamily: "var(--f-mono)", fontSize: 10,
            letterSpacing: "0.1em", color: "var(--c-wood)",
            textTransform: "uppercase",
          }}>{sub}</div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas
          title="Landmark Artwork — Divide Crossing"
          subtitle="Independence Rock (mile 815), Devil's Gate (mile 820), South Pass (mile 915) — the transition from Atlantic to Pacific watershed"
        >
          <LandmarkSection
            id="independence-rock"
            title="Independence Rock"
            ArtComponent={IndependenceRockArt}
            tone="warm"
            day="Day 60"
            caption="Independence Rock — &ldquo;Register of the Desert&rdquo;"
            notes={<><b>The trail's social bulletin board.</b> A massive granite dome rising from the flat Sweetwater plain — 1,900 ft long, ~130 ft tall. Pioneers aimed to reach it by July 4th (the namesake date). Thousands inscribed their names in axle grease, tar, paint, or chiseled stone. The wagon encampment shown is a celebratory one — fiddler, bonfire, gathered figures.</>}
            features={[
              { title: "Whale-back dome",          body: "Long, low, ROUNDED granite silhouette — 3:1 wider than tall. Totally unlike the spires and buttes that came before. The smooth weathered granite reads as ANCIENT, not jagged." },
              { title: "Pinkish-grey granite",     body: "Smoother, less layered than the Platte sandstone formations. Faint exfoliation curves and speckled texture — characteristic of weathered granite domes." },
              { title: "Carved names",             body: "Faint scribbled marks across the lower face — the 'register.' Don't try for legible text at this scale; suggest with the visual rhythm of inscriptions." },
              { title: "Tiny climbers",            body: "Small figures ascending the dome — gives scale + tells the story that pioneers actually CLIMBED this thing to add their names. The rock is climbable, unlike a butte." },
              { title: "Sweetwater River",         body: "Curves along the base. The river that the trail follows up toward South Pass — visual continuity with Devil's Gate which is just 5 miles further." },
              { title: "July 4th encampment",      body: "Fiddler + bonfire + gathered figures = celebration mood. Many wagon trains tried to time their arrival to the holiday and stopped here for the day to mark progress." },
            ]}
          />

          <LandmarkSection
            id="devils-gate"
            title="Devil's Gate"
            ArtComponent={DevilsGateArt}
            tone="warm"
            day="Day 60"
            caption="Devil&rsquo;s Gate — the Sweetwater cleft"
            notes={<><b>A 330-ft-deep slot canyon cut by the Sweetwater through a granite ridge.</b> The trail goes AROUND the ridge (south side, visible bypass), but emigrants almost universally hiked over to gawk. The drama: sheer vertical walls, river foaming through a gap maybe 30 ft wide. The ridge granite is darker and blockier than Independence Rock — more rugged.</>}
            features={[
              { title: "The cleft is the focal point", body: "Narrow vertical V-shaped slot center-frame, with a strip of bright sky visible at the top. The cleft DESCENDS into shadow — the deepest darks in the comp." },
              { title: "Sheer vertical walls",     body: "The cliff faces plunging into the gate are STRAIGHT VERTICAL — no slope, no skirt. The sheerness is the visual signature. Vertical striations emphasize this." },
              { title: "Foaming river",            body: "White foam where the Sweetwater rushes through the narrow gap — water has motion here, unlike the calm stretch by Independence Rock. Downstream wake fans out the right side." },
              { title: "Trail BYPASS",             body: "The wagon trail curves around the south (right) side of the ridge, NOT through the gate. A faint label confirms. This is the historical truth — the gate was a tourist stop, not a path." },
              { title: "Pioneers gawking",         body: "Small group of figures who walked over from the wagons, looking UP at the cleft. Heads tilted. Tells the human story — emigrants made the detour to see this." },
              { title: "Pines on slopes",          body: "Conifers scatter on the upper ridges — the elevation here supports juniper/pine, similar to Scotts Bluff. Distinguishes this granite from the lower Platte sandstones." },
            ]}
          />

          <LandmarkSection
            id="south-pass"
            title="South Pass"
            ArtComponent={SouthPassArt}
            tone="warm"
            day="Day 75"
            caption="South Pass — the Continental Divide"
            notes={<><b>The most-anticipated and most-anticlimactic place on the trail.</b> A 20-mile-wide grass saddle between the Wind River Range (snowy, distant, north) and Antelope Hills (low, brown, south). Pioneers expected mountain drama; many crossed without realizing they'd hit the divide. From here, all water flows to the Pacific. Pacific Springs is the small marsh just past the crest.</>}
            features={[
              { title: "Vast emptiness",           body: "The composition leaves enormous EMPTY SPACE — sky and sage plain dominate. The drama is psychological, not visual: pioneers are crossing a continent's spine but the landscape barely changes." },
              { title: "Distant Wind River peaks", body: "Jagged snow-capped peaks on the right horizon — 13,000 ft, snow even in July. They're FAR — atmospheric haze, not the focal point. Pioneers expected to cross THESE but the trail dodges through the pass instead." },
              { title: "Antelope Hills",           body: "Low brown hills on the left horizon — flank the south side of the pass. NO snow. The asymmetry (snow north, brown south) tells the story of which range is which." },
              { title: "Pacific Springs marker",   body: "Small wooden 'PACIFIC' post + tiny marshy pond just past the crest — the first water flowing west. The first concrete sign that you're across. Period-accurate emigrant marker." },
              { title: "Long strung-out train",    body: "Nine wagons stretch across the entire comp from foreground to far distance — gentle saddle, train spans miles. Wagon size progression = depth + the sense of vast scale." },
              { title: "Outrider pointing west",   body: "Mounted figure with arm extended — pointing toward Pacific Springs. The human moment that says 'we're across.' Without him, the image is just a landscape." },
            ]}
          />

          {/* Side-by-side silhouette comparison */}
          <DCSection id="compare" title="Side-by-side — silhouette read">
            <DCArtboard id="thumb-row" label="Trail-map thumbnail size" width={720} height={260}>
              <div style={{
                padding: 24, height: "100%", boxSizing: "border-box",
                display: "flex", flexDirection: "column", gap: 16,
              }}>
                <div style={{
                  fontFamily: "var(--f-mono)", fontSize: 11, letterSpacing: "0.14em",
                  color: "var(--c-wood)", textTransform: "uppercase",
                }}>Are the three reads distinct?</div>
                <div style={{
                  display: "grid", gridTemplateColumns: "1fr 1fr 1fr",
                  gap: 14, alignItems: "stretch",
                }}>
                  <ThumbCard label="Independence" sub="Whale-back dome, climbed" Art={IndependenceRockArt} tone="warm" tid="thumb-i" />
                  <ThumbCard label="Devil's Gate" sub="Vertical cleft, river through" Art={DevilsGateArt} tone="warm" tid="thumb-d" />
                  <ThumbCard label="South Pass"   sub="Vast saddle, distant peaks" Art={SouthPassArt} tone="warm" tid="thumb-p" />
                </div>
                <div style={{
                  fontFamily: "var(--f-body)", fontSize: 13, color: "var(--c-tan)",
                  lineHeight: 1.5, marginTop: 4,
                }}>
                  Distinct silhouettes: <b style={{color:"var(--c-tan-bright)"}}>Independence Rock</b> reads as a long HORIZONTAL DOME with people on it; <b style={{color:"var(--c-tan-bright)"}}>Devil's Gate</b> reads as a VERTICAL CLEFT cutting a wall in two; <b style={{color:"var(--c-tan-bright)"}}>South Pass</b> reads as EMPTY HORIZON with distant peaks. The three together tell the story of the trail's middle act — register your name, gawk at the gate, then quietly cross into the Pacific watershed.
                </div>
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

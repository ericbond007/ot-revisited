<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="eyebrow">PRIMARY</div>
<div class="row">
  <button style="background:#8a3a1a;color:#f5e6c8;border:2px solid #3a1a08;padding:0.5em 1em;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;border-radius:3px;font-family:inherit">REST</button>
  <button style="background:#c96a2a;color:#f5e6c8;border:2px solid #3a1a08;padding:0.5em 1em;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;border-radius:3px;font-family:inherit">REST · HOVER</button>
  <button disabled style="background:#8a3a1a;color:#f5e6c8;border:2px solid #3a1a08;padding:0.5em 1em;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;border-radius:3px;font-family:inherit;opacity:0.5">DISABLED</button>
</div>
<div class="eyebrow">ACTION (icon + label)</div>
<div class="row">
  <button style="display:inline-flex;align-items:center;gap:0.4em;padding:0.4em 0.8em;background:#8a3a1a;color:#f5e6c8;border:2px solid #3a1a08;border-radius:3px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;font-size:0.85em;font-family:inherit"><span style="font-size:1.2em">🚶</span>TRAVEL 3D</button>
  <button style="display:inline-flex;align-items:center;gap:0.4em;padding:0.4em 0.8em;background:#8a3a1a;color:#f5e6c8;border:2px solid #3a1a08;border-radius:3px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;font-size:0.85em;font-family:inherit"><span style="font-size:1.2em">🏕️</span>REST</button>
  <button style="display:inline-flex;align-items:center;gap:0.4em;padding:0.4em 0.8em;background:#c96a2a;color:#f5e6c8;border:2px solid #3a1a08;border-radius:3px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;font-size:0.85em;font-family:inherit;box-shadow:0 0 0 2px #8a3a1a, 0 0 16px rgba(201,106,42,0.7)"><span style="font-size:1.2em">🛶</span>FORD</button>
</div>
<div class="eyebrow">CHOICE CARD</div>
<button style="display:flex;align-items:center;gap:0.8em;width:100%;padding:0.8em 1em;background:#2a1a10;color:#e8c89a;border:2px solid #c96a2a;border-radius:3px;font-family:inherit;font-weight:700;text-align:left;font-size:14px"><span style="font-size:1.2em">🛶</span><span style="flex:1">Ford the river</span></button>
<button style="display:flex;align-items:center;gap:0.8em;width:100%;padding:0.8em 1em;background:#2a1a10;color:#e8c89a;border:2px solid #8a5a2a;border-radius:3px;font-family:inherit;font-weight:700;text-align:left;font-size:14px;opacity:0.5"><span style="font-size:1.2em;filter:grayscale(1)">💵</span><span style="flex:1">Hire ferry ($4)</span><span style="font-size:0.78em;font-style:italic;color:#e85a4a;font-weight:400">no cash</span></button>
</div></body></html>

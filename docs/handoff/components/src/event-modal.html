<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div style="background:#3d2817;border:3px solid #c96a2a;border-radius:3px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,0.7)">
  <div style="display:inline-flex;align-items:center;gap:0.4em;background:#2a1a10;border:1px solid #5a3a1a;padding:0.2em 0.7em;border-radius:20px;font-size:11px;letter-spacing:0.12em;color:#8a5a2a;font-weight:700;margin-bottom:8px"><span style="font-size:1.1em">🌩️</span>WEATHER</div>
  <div style="font-family:'Rye',Georgia,serif;color:#c96a2a;font-size:24px;line-height:1.2;letter-spacing:0.04em">A Sudden Hailstorm</div>
  <p style="font-family:'IM Fell English',Georgia,serif;color:#e8c89a;line-height:1.55;margin:12px 0 16px">Hailstones crack the canvas overhead. The oxen bolt for cover.</p>
  <div class="eyebrow" style="margin-bottom:8px">WHAT DO YOU DO?</div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <button style="display:flex;align-items:center;gap:0.8em;width:100%;padding:0.8em 1em;background:#2a1a10;color:#e8c89a;border:2px solid #c96a2a;border-radius:3px;font-family:inherit;font-weight:700;text-align:left">🐂 <span style="flex:1">Push through — keep moving</span></button>
    <button style="display:flex;align-items:center;gap:0.8em;width:100%;padding:0.8em 1em;background:#2a1a10;color:#e8c89a;border:2px solid #8a5a2a;border-radius:3px;font-family:inherit;font-weight:700;text-align:left">⛺ <span style="flex:1">Pitch camp until it passes</span></button>
  </div>
</div>
</div></body></html>
